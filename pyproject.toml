[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-collector"
version = "0.1.0"
description = "Normalizace, obohacování a ukládání dat o kybernetických útocích ze senzorů honeypotu."
readme = "collector/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Honeypot project" }]
dependencies = []

[project.optional-dependencies]
geoip = ["geoip2>=4.7,<5"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6",
]

[project.scripts]
honeypot-collector = "honeypot_collector.cli:main"

[tool.setuptools]
package-dir = { "" = "collector" }

[tool.setuptools.packages.find]
where = ["collector"]
include = ["honeypot_collector*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["collector", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["collector"]
addopts = "-q"
